# War Angel across its whole level set at the STANDARD tier (§10).
#
# The study #6b (PROGRESS item 5c) wants: one cell per level, same enemy, same seed,
# so a reader can read DPR and every panel channel as a function of level. `level:
# available` is the sentinel (§10.1) — War Angel's level set is SPARSE, and naming a
# list here would have to be re-edited every time the build gains a level.
#
# THE TIER IS 50,000 DAYS (standard), RAISED FROM 2,000 (quick) IN s62, AND THE
# REASON IS MEASURED RATHER THAN PREFERRED. Two things forced it:
#
#   1. §9.1 raises a `precision` warning on the quick tier. An authoritative run
#      must not publish an artifact that flags itself as imprecise.
#   2. A level sweep gets NO PAIRING BENEFIT, so each cell's noise is independent
#      and level-over-level differences carry BOTH cells' error. The streams are
#      keyed `(purpose, owner)` with `owner = entity.name` (§6.3), and the
#      character is named `WarAngel-L{level}` — so every level draws its own
#      substream by construction, and §6.1's 5.77x common-random-numbers gain
#      (s60) is structurally unavailable here. Measured consequence: L2 and L3 are
#      MECHANICALLY IDENTICAL (same weapon, +5/+5, AC 17, enemy AC 14, 1.25
#      atk/rd), so their true DPR difference is exactly zero — and at 2,000 days
#      they read 7.3826 vs 7.4483, a spurious 0.9% that is exactly 2 sigma of one
#      estimate. At 50,000 days the per-level stderr falls ~0.033 -> ~0.0066, which
#      is what makes the per-level curve's shape readable at all.
#
# Cost: ~47 minutes for all 16 cells (~3.5 ms/day measured over the level set).
sweep_schema_version: 1
name: war_angel_levels
description: >-
  War Angel L1-16 vs the standardized baseline enemy at the STANDARD tier (50,000
  days/cell). The definitive #6b evaluation (PROGRESS item 5c).
base:
  enemy: baseline
  n_days: 50000
  seed: 11
axes:
  build: [war_angel]
  level: available
